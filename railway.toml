# Railway Configuration as Code
# Docs: https://docs.railway.com/config-as-code/reference

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./bin/railway-start.sh"
healthcheckPath = "/up"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables for Railway
[vars]
RAILS_ENV = "production"
RAILS_LOG_TO_STDOUT = "true"
RAILS_SERVE_STATIC_FILES = "true"
ACTIVE_STORAGE_SERVICE = "render_local"
ACTIVE_STORAGE_ROOT = "/rails/storage/active_storage"
RUN_SOLID_QUEUE_IN_WEB = "1"
APP_BASE_URL = "https://${{RAILWAY_PUBLIC_DOMAIN}}"
# Railway mounts volumes as root; the main process must run as root to create the
# Active Storage subdirectory inside the mounted volume.
RAILWAY_RUN_UID = "0"
