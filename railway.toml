# Railway Configuration as Code
# Docs: https://docs.railway.com/config-as-code/reference

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./bin/railway-start.sh"
healthcheckPath = "/up"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables for Railway
[vars]
RAILS_ENV = "production"
RAILS_LOG_TO_STDOUT = "true"
RAILS_SERVE_STATIC_FILES = "true"
ACTIVE_STORAGE_SERVICE = "render_local"
ACTIVE_STORAGE_ROOT = "/rails/storage"
RUN_SOLID_QUEUE_IN_WEB = "1"
PORT = "80"
