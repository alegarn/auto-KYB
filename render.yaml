databases:
  - name: quick-kyb-render-db
    databaseName: quick_kyb_prod
    user: quick_kyb_user

services:
  - type: web
    name: quick-kyb-web
    runtime: ruby
    plan: starter
    numInstances: 1
    healthCheckPath: /up
    buildCommand: "./bin/render-build.sh"
    startCommand: "./bin/render-start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quick-kyb-render-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: ACTIVE_STORAGE_SERVICE
        value: render_local
      - key: ACTIVE_STORAGE_ROOT
        value: /opt/render/project/src/storage
      - key: RUN_SOLID_QUEUE_IN_WEB
        value: "1"
    disk:
      name: storage-disk
      mountPath: /opt/render/project/src/storage
      sizeGB: 1