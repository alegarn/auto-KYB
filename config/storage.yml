test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

render_local:
  service: Disk
  root: <%= ENV.fetch("ACTIVE_STORAGE_ROOT", Rails.root.join("storage").to_s) %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# Enable in production with: config.active_storage.service = :amazon
# Requires aws-sdk-s3 gem
amazon:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) || ENV['AWS_ACCESS_KEY_ID'] %>
  secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) || ENV['AWS_SECRET_ACCESS_KEY'] %>
  region: <%= Rails.application.credentials.dig(:aws, :region) || ENV['AWS_REGION'] || "us-east-1" %>
  bucket: <%= Rails.env.production? ? (Rails.application.credentials.dig(:aws, :s3_bucket_production) || ENV['S3_BUCKET_PRODUCTION']) : (Rails.application.credentials.dig(:aws, :s3_bucket_development) || ENV['S3_BUCKET_DEVELOPMENT'] || "amzn-s3-quick-kyb") %>
  upload:
    server_side_encryption: "aws:kms"

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

